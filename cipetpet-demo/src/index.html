<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Tarayıcıda Türkçe sesli sohbet: Duyu-small konuşma tanıma, OpenRouter üzerinden bir dil modeli ve Antalia-2 Mini ses sentezi." />
    <title>cipetpet sesli sohbet</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f766e'/%3E%3Cpath d='M6 12h1.5M9 9v6M12 6.5v11M15 9.5v5M18 11v2' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/assets/app.css" />
    <script>
      // Starts the app. WASM threads need a cross-origin isolated page (COOP + COEP headers). The demo's own server
      // sends them. A host that cannot (GitHub Pages) gets them from a service worker (/coi-sw.js), which takes one
      // reload: the app is started only once the page is isolated, or once it is clear that it will not become so
      // (private mode, no service workers, a hard reload that bypasses the worker); it then runs on one thread.
      (function () {
        var decided = false;
        function start() {
          if (decided) return;
          decided = true;
          var s = document.createElement("script");
          s.type = "module";
          s.src = "/assets/app.js";
          document.head.appendChild(s);
        }
        function reloadOnce() {
          if (decided) return;
          decided = true;
          try { sessionStorage.setItem("cipetpet-coi-reload", "1"); } catch (e) {}
          location.reload();
          // if the reload does not happen (it dies with the page when it does), do not leave a blank page
          setTimeout(function () { decided = false; start(); }, 4000);
        }
        if (window.crossOriginIsolated || !window.isSecureContext || !("serviceWorker" in navigator)) return start();
        var reloaded = false;
        try { reloaded = sessionStorage.getItem("cipetpet-coi-reload") === "1"; } catch (e) {}
        if (reloaded) return start();
        navigator.serviceWorker.register("/coi-sw.js").then(function (reg) {
          // already controlling this page, yet not isolated: the document was served before the worker took over
          if (navigator.serviceWorker.controller) return reloadOnce();
          // installed earlier, but this load bypassed it (hard reload): it cannot isolate this load
          if (reg.active && !reg.installing && !reg.waiting) return start();
          // first visit: the worker calls clients.claim() when it activates
          navigator.serviceWorker.addEventListener("controllerchange", reloadOnce);
          setTimeout(start, 6000);
        }, start);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Bu demo JavaScript gerektirir. / This demo needs JavaScript.</noscript>
  </body>
</html>
